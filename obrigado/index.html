  <style>
    :root{--teal-900:#0A2723;--teal-800:#0A5C50;--teal-500:#14A088;--mint:#7CEBC8;--neon:#2FE6D6;--ink:#16201E;--muted:#5B6B67}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Montserrat',system-ui,sans-serif;min-height:100vh;color:#eafaf6;
      background:
        radial-gradient(1100px 520px at 78% -8%, rgba(20,160,136,.5), transparent 60%),
        radial-gradient(760px 420px at 6% 106%, rgba(124,235,200,.14), transparent 55%),
        linear-gradient(160deg,var(--teal-900) 0%, #0b3730 48%, var(--teal-800) 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px;position:relative;overflow:hidden}
    body::before{content:"M";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:34vw;letter-spacing:-.03em;color:rgba(255,255,255,.03);z-index:0;pointer-events:none;line-height:1}
    .box{position:relative;z-index:2;width:100%;max-width:640px;text-align:center;animation:mh-in .55s cubic-bezier(.22,1,.36,1) both}
    @keyframes mh-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .check{width:70px;height:70px;border-radius:50%;margin:0 auto 26px;display:grid;place-items:center;background:rgba(47,230,214,.08);border:2px solid var(--neon);color:var(--neon);box-shadow:0 0 26px -6px rgba(47,230,214,.6);animation:mh-pop .5s .12s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes mh-pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
    .check svg{width:34px;height:34px;stroke-dasharray:30;stroke-dashoffset:30;animation:mh-draw .45s .3s ease forwards}
    @keyframes mh-draw{to{stroke-dashoffset:0}}
    h1{font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:1;font-size:clamp(2rem,7vw,3.4rem);color:#fff}
    h1 span{color:var(--neon);text-shadow:0 0 22px rgba(47,230,214,.45)}
    .card{background:#fff;color:var(--ink);border-radius:20px;margin-top:30px;padding:34px 30px 30px;box-shadow:0 30px 60px -25px rgba(0,0,0,.55);border-top:5px solid var(--neon);text-align:center;animation:mh-in .55s .1s cubic-bezier(.22,1,.36,1) both}
    .card h2{font-weight:900;text-transform:uppercase;letter-spacing:.02em;font-size:1.25rem;color:var(--teal-900);margin-bottom:16px}
    .card p{font-weight:700;text-transform:uppercase;line-height:1.5;font-size:clamp(.92rem,2.4vw,1.05rem);color:var(--teal-900);margin-bottom:26px}
    .scarcity{display:flex;align-items:center;justify-content:center;gap:.55rem;margin-top:20px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--muted)}
    .pulse{width:9px;height:9px;border-radius:50%;background:#ff6b6b;animation:pulse 1.8s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.55)}70%{box-shadow:0 0 0 10px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
    .btn-whatsapp{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;text-decoration:none;font-weight:800;font-size:clamp(.92rem,2.4vw,1rem);padding:14px 26px;border-radius:12px;margin-top:8px;box-shadow:0 10px 24px -6px rgba(37,211,102,.5);transition:transform .15s ease,box-shadow .15s ease;letter-spacing:.02em;width:100%;max-width:360px}
    .btn-whatsapp:hover{transform:translateY(-2px);box-shadow:0 14px 28px -6px rgba(37,211,102,.65)}
    .redirect-timer{margin-top:14px;font-size:.84rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .redirect-timer strong{color:var(--teal-800);font-weight:900}
    .foot{margin-top:26px;color:#7fa39a;font-size:.72rem;letter-spacing:.04em}
  </style>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N4H8GQW5"

<!-- End Google Tag Manager (noscript) -->

  <div class="box">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>

    <h1>Cadastro <span>realizado!</span></h1>

    <div class="card">
      <h2>Cadastro recebido!</h2>
      <p>
        Recebemos seus dados para a M Hair <span data-cidade>Vila Romana</span>.
        Aguarde um instante para iniciar o agendamento no WhatsApp...
      </p>

      <a id="btnWhats" href="#" class="btn-whatsapp">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        Abrir WhatsApp agora
      </a>

      <div class="redirect-timer">Abrindo WhatsApp em <strong id="timer">3</strong> segundos...</div>

      <div class="scarcity"><span class="pulse"></span> Vagas preenchendo agora</div>
    </div>

    <p class="foot">© 2026 M HAIR — Restauração Capilar</p>
  </div>

  <script>
    (function(){
      var q = new URLSearchParams(location.search);
      var cidade = q.get('c') || 'Vila Romana';
      var nome = q.get('n') || '';
      var email = q.get('e') || '';
      var telefone = q.get('t') || '';

      document.querySelectorAll('[data-cidade]').forEach(function(el){ el.textContent = cidade; });
      document.title = 'Cadastro realizado | M Hair ' + cidade;

      if(window.dataLayer) window.dataLayer.push({ event:'lead_lancamento', cidade:cidade });

      // pixel da unidade
      var PIXELS = {
        'Vila Romana': '655092087275080',
        'Vila Romana - Lapa': '655092087275080'
      };
      var pid = PIXELS[cidade];
      if(window.fbq && pid){
        fbq('init', pid);
        fbq('track','PageView');
        // Lead disparado por código (este pixel ainda não tem a regra de URL).
        // Se criar a regra "URL contém /obrigado → Lead" no Gerenciador de Eventos,
        // apague a linha abaixo para não contar o Lead em dobro.
        fbq('track','Lead');
      }

      // Preparação dos dados para o WhatsApp do atendimento (+55 11 91502-5046)
      var numeroWhats = '5511915025046';
      var linhas = [
        'Olá! Acabei de me cadastrar para a avaliação capilar gratuita.',
        ''
      ];
      if(nome) linhas.push('• Nome: ' + nome);
      if(telefone) linhas.push('• WhatsApp: ' + telefone);
      if(email) linhas.push('• E-mail: ' + email);
      linhas.push('• Unidade: ' + cidade);

      var waUrl = 'https://wa.me/' + numeroWhats + '?text=' + encodeURIComponent(linhas.join('\n'));

      var btn = document.getElementById('btnWhats');
      if(btn) btn.href = waUrl;

      // Aguarda 3 segundos e redireciona automaticamente para o WhatsApp
      var count = 3;
      var timerEl = document.getElementById('timer');
      var timerInterval = setInterval(function(){
        count--;
        if(timerEl) timerEl.textContent = count;
        if(count <= 0){
          clearInterval(timerInterval);
          window.location.href = waUrl;
        }
      }, 1000);
    })();
  </script>
</body>
